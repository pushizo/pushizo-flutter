group = "com.herosignal.herosignal_flutter"
version = "0.1.0"

buildscript {
    ext.kotlin_version = "2.2.20"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.11.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        mavenLocal()
    }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"

android {
    namespace = "com.herosignal.herosignal_flutter"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
    }

    defaultConfig {
        minSdk = 24
    }
}

dependencies {
    // Monorepo içinde uygulama settings.gradle'ında ":herosignal" modülü varsa kaynaktan,
    // yoksa yayınlanmış artefakttan (gradle publishToMavenLocal / Maven Central) alınır.
    if (rootProject.findProject(":herosignal") != null) {
        api(project(":herosignal"))
    } else {
        api("com.herosignal:herosignal-android:0.1.0")
    }
}
