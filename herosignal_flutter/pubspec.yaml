name: herosignal_flutter
description: "HeroSignal Flutter SDK: push kaydı, kullanıcı/tag yönetimi, olaylar ve teslimat geri bildirimi (Android, iOS ve web)."
version: 0.1.0
homepage: https://github.com/exec0de/herosignal/tree/main/sdk/flutter/herosignal_flutter
repository: https://github.com/exec0de/herosignal
issue_tracker: https://github.com/exec0de/herosignal/issues
documentation: https://github.com/exec0de/herosignal/blob/main/docs/sdk/flutter.md
# pub.dev yayını sdk-release.yml `pubdev` işiyle (workflow_dispatch) yapılır; yerel `dart pub publish --dry-run` ile kontrol edin.

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.herosignal.herosignal_flutter
        pluginClass: HerosignalFlutterPlugin
      ios:
        pluginClass: HerosignalFlutterPlugin
      web:
        pluginClass: HerosignalFlutterWeb
        fileName: herosignal_flutter_web.dart
