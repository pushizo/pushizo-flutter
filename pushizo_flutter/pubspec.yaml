name: pushizo_flutter
description: "Pushizo Flutter SDK: push kaydı, kullanıcı/tag yönetimi, olaylar ve teslimat geri bildirimi (Android, iOS ve web)."
version: 0.1.0
homepage: https://docs.pushizo.com/docs/sdk/flutter
repository: https://github.com/pushizo/pushizo-flutter
issue_tracker: https://github.com/pushizo/pushizo-flutter/issues
documentation: https://docs.pushizo.com/docs/sdk/flutter
# pub.dev yayını sdk-release.yml `pubdev` işiyle (workflow_dispatch) yapılır; yerel `dart pub publish --dry-run` ile kontrol edin.

environment:
  sdk: ^3.10.7
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.pushizo.pushizo_flutter
        pluginClass: PushizoFlutterPlugin
      ios:
        pluginClass: PushizoFlutterPlugin
      web:
        pluginClass: PushizoFlutterWeb
        fileName: pushizo_flutter_web.dart
